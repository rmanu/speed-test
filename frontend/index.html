<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: -1.5rem;
      text-align: center;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 16px;
      padding: 1.75rem 2.25rem;
      min-width: 160px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .card.active {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f638;
    }

    .card.done {
      border-color: #22c55e;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 0.6rem;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .card-unit {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.4rem;
    }

    .progress-bar-wrap {
      width: 320px;
      height: 6px;
      background: #2d3348;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .status {
      font-size: 0.85rem;
      color: #64748b;
      height: 1.2em;
      text-align: center;
    }

    button {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Speed Test</h1>
  <p class="subtitle">Measures latency, download, and upload speed to this server</p>

  <div class="cards">
    <div class="card" id="card-ping">
      <div class="card-label">Ping</div>
      <div class="card-value" id="val-ping">--</div>
      <div class="card-unit">ms</div>
    </div>
    <div class="card" id="card-download">
      <div class="card-label">Download</div>
      <div class="card-value" id="val-download">--</div>
      <div class="card-unit">Mbps</div>
    </div>
    <div class="card" id="card-upload">
      <div class="card-label">Upload</div>
      <div class="card-value" id="val-upload">--</div>
      <div class="card-unit">Mbps</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress"></div>
  </div>

  <p class="status" id="status">Ready</p>

  <button id="btn" onclick="runTest()">Start Test</button>

<script>
  // API is always at /api/speedtest relative to the origin, regardless of
  // where the frontend is served (e.g. /apps/speedtest).
  const BASE_URL = window.location.origin + '/api/speedtest';

  const PING_ROUNDS = 10;
  const PAYLOAD_MB = 10;

  function setVal(id, v) {
    document.getElementById(id).textContent = v;
  }

  function setProgress(pct) {
    document.getElementById('progress').style.width = pct + '%';
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  function setActive(cardId) {
    ['card-ping', 'card-download', 'card-upload'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active', 'done');
    });
    if (cardId) document.getElementById(cardId).classList.add('active');
  }

  function setDone(cardId) {
    document.getElementById(cardId).classList.remove('active');
    document.getElementById(cardId).classList.add('done');
  }

  async function measurePing() {
    setActive('card-ping');
    setStatus('Measuring latency...');
    const times = [];
    for (let i = 0; i < PING_ROUNDS; i++) {
      const t0 = performance.now();
      await fetch(`${BASE_URL}/ping`, { cache: 'no-store' });
      times.push(performance.now() - t0);
      setProgress((i + 1) / PING_ROUNDS * 30);
      setVal('val-ping', Math.round(Math.min(...times)));
    }
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    setVal('val-ping', Math.round(avg));
    setDone('card-ping');
    return Math.round(avg);
  }

  async function measureDownload() {
    setActive('card-download');
    setStatus('Measuring download speed...');
    const url = `${BASE_URL}/download?size=${PAYLOAD_MB}`;
    const totalBytes = PAYLOAD_MB * 1024 * 1024;
    const t0 = performance.now();
    let received = 0;

    const resp = await fetch(url, { cache: 'no-store' });
    const reader = resp.body.getReader();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      received += value.length;
      const elapsed = (performance.now() - t0) / 1000;
      const mbps = (received * 8) / elapsed / 1_000_000;
      setVal('val-download', mbps.toFixed(1));
      setProgress(30 + (received / totalBytes) * 35);
    }

    const elapsed = (performance.now() - t0) / 1000;
    const mbps = (received * 8) / elapsed / 1_000_000;
    setVal('val-download', mbps.toFixed(1));
    setDone('card-download');
    return mbps;
  }

  async function measureUpload() {
    setActive('card-upload');
    setStatus('Measuring upload speed...');

    const totalBytes = PAYLOAD_MB * 1024 * 1024;
    // Build random payload in 64 KB chunks (browser API limit per call)
    const buf = new Uint8Array(totalBytes);
    const step = 65536;
    for (let offset = 0; offset < totalBytes; offset += step) {
      crypto.getRandomValues(buf.subarray(offset, offset + step));
    }

    const t0 = performance.now();
    const resp = await fetch(`${BASE_URL}/upload`, {
      method: 'POST',
      body: buf,
      headers: { 'Content-Type': 'application/octet-stream' },
    });
    await resp.json();
    const elapsed = (performance.now() - t0) / 1000;
    const mbps = (totalBytes * 8) / elapsed / 1_000_000;

    setVal('val-upload', mbps.toFixed(1));
    setProgress(100);
    setDone('card-upload');
    return mbps;
  }

  async function runTest() {
    const btn = document.getElementById('btn');
    btn.disabled = true;

    // Reset
    ['val-ping', 'val-download', 'val-upload'].forEach(id => setVal(id, '--'));
    ['card-ping', 'card-download', 'card-upload'].forEach(id => {
      document.getElementById(id).classList.remove('active', 'done');
    });
    setProgress(0);

    try {
      await measurePing();
      await measureDownload();
      await measureUpload();
      setStatus('Done');
      setActive(null);
    } catch (err) {
      setStatus('Error: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
